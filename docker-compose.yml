services:
  fadivs-fullstream-bot:
    build: .
    container_name: fadivs-fullstream-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/data
      # Optional authorized Twitch cookies, if a VOD requires login:
      # - ./private/twitch-cookies.txt:/run/secrets/twitch-cookies.txt:ro
    init: true
    stop_grace_period: 30s
