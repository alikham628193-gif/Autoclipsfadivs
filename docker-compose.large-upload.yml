# Optional overlay for a self-hosted Telegram Bot API server (large uploads).
# First obtain TELEGRAM_API_ID and TELEGRAM_API_HASH from https://my.telegram.org.
# Set TELEGRAM_API_BASE_URL=http://telegram-bot-api:8081 in .env before starting.
services:
  fadivs-fullstream-bot:
    depends_on:
      - telegram-bot-api

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: fadivs-telegram-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID in your shell or compose .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH in your shell or compose .env}
      TELEGRAM_LOCAL: "1"
    volumes:
      - ./telegram-bot-api-data:/var/lib/telegram-bot-api
    expose:
      - "8081"
